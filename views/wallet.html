<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Bitburg - Password Wallet</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/css/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
        <script src="/js/wallet.js"></script>
        <script src="/js/password-manager.js"></script>
    </head>
    <body id="wallet">
        <header>
            <div id="logo-section">
                <a class="logo" href="/"><img id="logo-img" src="/images/BitBurg_logo.png" alt="BitBurg Logo">
                <span class="logo-text">BitBurg - Wallet</span></a>
            </div>
            <a><i id="user-icon" class="fas fa-user user-icon profil"></i></a>
        </header>
        <div id="wallet-container">

            <form id="popup-form" action="./addPassword" method="POST">
                <label for="name-input">Name:</label>
                <input id="name-input" class="inputbox" type="text">
                <label for="username-input">Benutzername/Email:</label>
                <input id="username-input" class="inputbox" type="text">
                <label for="password-input">Passwort:</label>
                <div id="password-group">
                    <input id="password-input" class="inputbox" type="password">
                    <button type="button" id="password-generator"><i class="fa-solid fa-shuffle"></i></button>
                </div>
                <div id="button-container">
                    <button id="cancel-button">Abbrechen</button>
                    <button id="add-password-button">Hinzufuegen</button>
                </div>
            </form>

            <div class="spacer"></div>
            <ul id="password-container">
                <li class="password-card">Paypal</li>
                <li class="password-card">Anki</li>
                <li class="password-card">Anki</li>
                <li class="password-card">Anki</li>

            </ul>
            <button id="add-button" class="fa-solid fa-plus"></button>
        </div>
       <footer>
            <p>&copy; 2026 Bitburg Manager</p>
       </footer> 
    </body>
</html>
